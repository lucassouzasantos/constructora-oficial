version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: constructora-backend
    ports:
      - "3000:3000"
    env_file:
      # Puxa o arquivo .env de dentro da pasta backend com a senha do Supabase
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Configuração de Proxy Reverso ativada: o Frontend vai bater no atalho /api internamente
        - VITE_API_URL=/api
    container_name: constructora-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
